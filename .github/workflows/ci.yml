name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qm_core
          POSTGRES_USER: qm_core
          POSTGRES_PASSWORD: qm_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qm_core -d qm_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-secret
      POSTGRES_DB: qm_core
      POSTGRES_USER: qm_core
      POSTGRES_PASSWORD: qm_core
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
