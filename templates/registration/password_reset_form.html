<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset hasła | QM Identity</title><style>
body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #111; }
main { max-width: 28rem; margin: 10vh auto; background: #fff; padding: 2rem; border-radius: .75rem; }
label { display:block; margin-top:1rem; font-weight:600; }
input { width:100%; box-sizing:border-box; padding:.75rem; margin-top:.35rem; }
button { width:100%; margin-top:1.25rem; padding:.8rem; cursor:pointer; }
.errorlist { color:#9b1c1c; } a { color:inherit; }
</style></head><body><main><h1>Reset hasła</h1><p>Podaj e-mail konta QM Identity. Jeśli aktywne konto istnieje, wyślemy link do ustawienia nowego hasła.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<label for="{{ form.email.id_for_label }}">E-mail</label>{{ form.email }}{{ form.email.errors }}<button type="submit">Wyślij link</button></form><p><a href="{% url 'login' %}">Wróć do logowania</a></p></main></body></html>
