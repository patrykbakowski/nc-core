<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QM Identity</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #111; }
    main { max-width: 28rem; margin: 10vh auto; background: #fff; padding: 2rem; border-radius: 0.75rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 0.75rem; margin-top: 0.35rem; }
    button { width: 100%; margin-top: 1.25rem; padding: 0.8rem; cursor: pointer; }
    .errorlist { color: #9b1c1c; }
  </style>
</head>
<body>
<main>
  <h1>QM Identity</h1>
  <p>Zaloguj się wspólnym kontem QManufacture.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="{{ form.username.id_for_label }}">E-mail</label>
    {{ form.username }}
    {{ form.username.errors }}
    <label for="{{ form.password.id_for_label }}">Hasło</label>
    {{ form.password }}
    {{ form.password.errors }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Zaloguj się</button>
  </form>
  <p><a href="{% url 'password_reset' %}">Nie pamiętam hasła</a></p>
</main>
</body>
</html>
